# Kafka 3.8.0 single-node combined KRaft broker/controller for Railway.
# Node-specific addresses and secrets are injected and validated at startup.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
listeners=INTERNAL://:29092,HOST://:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=INTERNAL://localhost:29092,HOST://localhost:9092
listener.security.protocol.map=INTERNAL:SASL_SSL,HOST:SASL_SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
ssl.client.auth=none
ssl.endpoint.identification.algorithm=https
listener.name.internal.ssl.keystore.type=PKCS12
listener.name.internal.ssl.truststore.type=PKCS12
listener.name.host.ssl.keystore.type=PKCS12
listener.name.host.ssl.truststore.type=PKCS12
listener.name.internal.ssl.client.auth=none
listener.name.host.ssl.client.auth=none
