services:
  fo:
    entrypoint: ["python"]
    command:
      - -m
      - WM_FO.WM_FO
      - --kafka-host
      - "${KAFKA_HOST:?Set KAFKA_HOST in .env.railway}"
      - --kafka-port
      - "${KAFKA_PORT:?Set KAFKA_PORT in .env.railway}"
      - --operator-id
      - "${FO_OPERATOR_ID:?Pass an operator ID to scripts/run-fo.sh}"
      - --panel-host
      - 0.0.0.0
      - --panel-port
      - "7100"
    ports:
      - "127.0.0.1:${FO_PANEL_PORT:-7201}:7100"
    environment:
      KAFKA_SSL_CA_LOCATION: /run/secrets/kafka/ca.pem

networks:
  watermanagement:
    external: true
    name: watermanagement-local