services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: ${KAFKA_BROKER_NAME:-kafka}
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_INTERNAL_HOST:-${KAFKA_BROKER_NAME:-kafka}}:29092,HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_BROKER_NAME:-kafka}:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./config/kafka:/mnt/shared/config:ro
    networks:
      kafka-network:
        aliases:
          - "${KAFKA_BROKER_NAME:-kafka}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/bash", "-ec"]
    command: ["/kafka-init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER_NAME:-kafka}:29092
      KAFKA_PARTITIONS: "${KAFKA_PARTITIONS:-}"
      KAFKA_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
    volumes:
      - ./scripts/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    restart: "no"
    networks:
      - kafka-network
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:

networks:
  kafka-network:
