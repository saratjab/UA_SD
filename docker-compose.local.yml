name: watermanagement-local

x-app-defaults: &app-defaults
  image: watermanagement-app:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  environment: &kafka-client-environment
    KAFKA_REQUIRE_SECURITY: "${KAFKA_REQUIRE_SECURITY:-false}"
    KAFKA_SECURITY_PROTOCOL: "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}"
    KAFKA_SASL_MECHANISM: "${KAFKA_SASL_MECHANISM:-}"
    KAFKA_SASL_USERNAME: "${KAFKA_SASL_USERNAME:-}"
    KAFKA_SASL_PASSWORD: "${KAFKA_SASL_PASSWORD:-}"
    KAFKA_SSL_CA_LOCATION: "${KAFKA_SSL_CA_LOCATION:-/run/secrets/kafka/ca.pem}"
    KAFKA_SSL_CA_PEM: "${KAFKA_SSL_CA_PEM:-}"
  networks:
    - watermanagement

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: ${KAFKA_BROKER_NAME:-kafka}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PUBLISHED_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_INTERNAL_HOST:-${KAFKA_BROKER_NAME:-kafka}}:29092,HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-${KAFKA_PUBLISHED_PORT:-9092}}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_BROKER_NAME:-kafka}:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./config/kafka:/mnt/shared/config:ro
    # Preserve the stable Compose service name while allowing the advertised
    # broker hostname to be configured for this private network.
    networks:
      watermanagement:
        aliases:
          - "${KAFKA_BROKER_NAME:-kafka}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/bash", "-ec"]
    command: ["/kafka-init-topics.sh"]
    environment:
      <<: *kafka-client-environment
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_HOST:-${KAFKA_BROKER_NAME:-kafka}}:${KAFKA_PORT:-29092}"
      KAFKA_PARTITIONS: "${KAFKA_PARTITIONS:-}"
      KAFKA_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
    volumes:
      - ./scripts/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    restart: "no"
    networks:
      - watermanagement
    depends_on:
      kafka:
        condition: service_healthy

  central:
    <<: *app-defaults
    container_name: wm-central
    command:
      - python
      - -m
      - WM_Central.main
      - --socket-host
      - 0.0.0.0
      - --socket-port
      - "${CENTRAL_SOCKET_PORT:-5000}"
      - --kafka-host
      - "${KAFKA_HOST:-${KAFKA_BROKER_NAME:-kafka}}"
      - --kafka-port
      - "${KAFKA_PORT:-29092}"
      - --db-path
      - "${DB_PATH:-/data/wm_central.db}"
      - --admin-host
      - "${CENTRAL_ADMIN_HOST:-0.0.0.0}"
      - --admin-port
      - "${CENTRAL_ADMIN_PORT:-0}"
      - --seed-dev
    environment:
      <<: *kafka-client-environment
      CENTRAL_SOCKET_PORT: "${CENTRAL_SOCKET_PORT:-5000}"
      CENTRAL_ADMIN_HOST: "${CENTRAL_ADMIN_HOST:-0.0.0.0}"
      CENTRAL_ADMIN_PORT: "${CENTRAL_ADMIN_PORT:-0}"
      CENTRAL_ADMIN_TOKEN: "${CENTRAL_ADMIN_TOKEN:-}"
      CENTRAL_ADMIN_REQUIRE_HTTPS: "${CENTRAL_ADMIN_REQUIRE_HTTPS:-false}"
    ports:
      - "${CENTRAL_PUBLISHED_PORT:-5000}:${CENTRAL_SOCKET_PORT:-5000}"
      - "127.0.0.1:${CENTRAL_ADMIN_PUBLISHED_PORT:-8001}:${CENTRAL_ADMIN_PORT:-8001}"
    volumes:
      - central-data:/data
    stdin_open: true
    tty: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,socket; s=socket.create_connection(('127.0.0.1', int(os.environ['CENTRAL_SOCKET_PORT'])), timeout=2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ws1-monitor:
    <<: *app-defaults
    command:
      - python
      - -m
      - WM_WS.WM_WS_M.main
      - --ws-id
      - "${WS1_ID:-WS_001}"
      - --location
      - "${WS1_LOCATION:-North Garden}"
      - --central-host
      - "${CENTRAL_HOST:-central}"
      - --central-port
      - "${CENTRAL_PORT:-${CENTRAL_SOCKET_PORT:-5000}}"
      - --engine-host
      - 0.0.0.0
      - --engine-port
      - "${WS1_ENGINE_PORT:-6001}"
      - --health-interval
      - "${MONITOR_HEALTH_INTERVAL:-1.0}"
    depends_on:
      central:
        condition: service_healthy

  ws1-engine:
    <<: *app-defaults
    stdin_open: true
    tty: true
    command:
      - python
      - -m
      - WM_WS.WM_WS_E.main
      - --ws-id
      - "${WS1_ID:-WS_001}"
      - --kafka-host
      - "${KAFKA_HOST:-${KAFKA_BROKER_NAME:-kafka}}"
      - --kafka-port
      - "${KAFKA_PORT:-29092}"
      - --monitor-host
      - ws1-monitor
      - --monitor-port
      - "${WS1_ENGINE_PORT:-6001}"
      - --state-path
      - "/engine-state/.wm_ws_e_${WS1_ID:-WS_001}.sqlite3"
      - --local-operator-id
      - "${WS1_LOCAL_OPERATOR_ID:-OP_002}"
    volumes:
      - ws1-engine-state:/engine-state
    depends_on:
      ws1-monitor:
        condition: service_started

  ws2-monitor:
    <<: *app-defaults
    command:
      - python
      - -m
      - WM_WS.WM_WS_M.main
      - --ws-id
      - "${WS2_ID:-WS_002}"
      - --location
      - "${WS2_LOCATION:-South Garden}"
      - --central-host
      - "${CENTRAL_HOST:-central}"
      - --central-port
      - "${CENTRAL_PORT:-${CENTRAL_SOCKET_PORT:-5000}}"
      - --engine-host
      - 0.0.0.0
      - --engine-port
      - "${WS2_ENGINE_PORT:-6002}"
      - --health-interval
      - "${MONITOR_HEALTH_INTERVAL:-1.0}"
    depends_on:
      central:
        condition: service_healthy

  ws2-engine:
    <<: *app-defaults
    stdin_open: true
    tty: true
    command:
      - python
      - -m
      - WM_WS.WM_WS_E.main
      - --ws-id
      - "${WS2_ID:-WS_002}"
      - --kafka-host
      - "${KAFKA_HOST:-${KAFKA_BROKER_NAME:-kafka}}"
      - --kafka-port
      - "${KAFKA_PORT:-29092}"
      - --monitor-host
      - ws2-monitor
      - --monitor-port
      - "${WS2_ENGINE_PORT:-6002}"
      - --state-path
      - "/engine-state/.wm_ws_e_${WS2_ID:-WS_002}.sqlite3"
      - --local-operator-id
      - "${WS2_LOCAL_OPERATOR_ID:-OP_003}"
    volumes:
      - ws2-engine-state:/engine-state
    depends_on:
      ws2-monitor:
        condition: service_started

  fo:
    <<: *app-defaults
    profiles: [operator]
    entrypoint: [python, -m, WM_FO.main]
    command:
      - --kafka-host
      - "${KAFKA_HOST:-kafka}"
      - --kafka-port
      - "${KAFKA_PORT:-29092}"
      - --operator-id
      - "${FO_OPERATOR_ID:-OP_001}"
volumes:
  central-data:
  kafka-data:
  ws1-engine-state:
  ws2-engine-state:

networks:
  watermanagement:
    name: watermanagement-local

